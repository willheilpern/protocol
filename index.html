<style>
:root {
  /* One-hand gym logger: actions sit in the thumb zone, tabs at the bottom, rest timer docked above them. */
  --bg: #0B0D11;
  --surface: #14171D;
  --raised: #1C2028;
  --line: #262C36;
  --text: #EEF1F5;
  --muted: #8C95A6;
  --accent: #4F8CFF;
  --good: #34C27A;
  --warn: #F0A848;
  --bad: #FF5B61;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 var(--body); -webkit-text-size-adjust: 100%; }
#root, .app { height: 100%; }
button { font-family: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: default; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font: 600 26px/1.1 var(--display); letter-spacing: .2px; }
h3 { font: 600 21px/1.15 var(--display); letter-spacing: .2px; }
h4 { margin: 12px 0 2px; font: 600 12.5px var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
p { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 14px; } .xs { font-size: 12.5px; }
.ic { flex: none; }

/* Shell */
.screen { position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.screen-in { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 150px); display: flex; flex-direction: column; gap: 14px; }
.hdr { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding-top: 4px; }
.hdr h1 { font: 700 40px/1 var(--display); letter-spacing: .3px; margin-top: 2px; }
.hdr-actions { display: flex; align-items: center; gap: 4px; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(env(safe-area-inset-bottom) + 4px); background: rgba(11, 13, 17, .94); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.tab { border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; min-height: 50px; font-size: 11px; font-weight: 600; }
.tab.on { color: var(--accent); }
.resumebar { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 70px); z-index: 11; max-width: 616px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 14px; border-radius: 16px; border: 1px solid #2C4A80; background: #122039; color: var(--text); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); text-align: left; }
.rs-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); flex: none; animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .3; } }
.rs-name { font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rs-time { color: var(--muted); font-weight: 600; }
.rs-rest { font-size: 13px; font-weight: 700; color: #9DBEFF; }
.rs-rest.done { color: var(--good); }
.rs-go { display: flex; align-items: center; color: var(--accent); font-weight: 700; }

/* Cards, buttons, chips */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.flat { background: var(--raised); border-color: transparent; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn { appearance: none; border: 0; border-radius: 12px; min-height: 46px; padding: 0 16px; font: 600 16px var(--body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--text); background: var(--raised); text-decoration: none; text-align: center; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.ghost { background: var(--raised); }
.card .btn.ghost, .sheet .btn.ghost { background: #232833; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.dangerghost { background: transparent; color: var(--bad); border: 1px solid #4A2326; }
.btn.light { background: #fff; color: #0B2A18; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 15px; border-radius: 10px; }
.btn.xs { min-height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn.big { min-height: 56px; font-size: 18px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .42; }
.btnrow { display: flex; gap: 8px; }
.btnrow > .btn { flex: 1; }
.btnrow.wrap { flex-wrap: wrap; }
.btnrow.wrap > .btn { flex: 1 1 auto; }
.btngrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--text); display: inline-grid; place-items: center; flex: none; }
.iconbtn.sm { width: 34px; height: 34px; }
.link { background: none; border: 0; color: var(--accent); font: 600 15px var(--body); display: inline-flex; align-items: center; gap: 2px; padding: 6px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; padding: 0 10px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); font: 500 13px var(--body); color: var(--text); white-space: nowrap; }
.chip.def { border-style: dashed; border-color: #5A6474; color: #AEB6C4; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.big { min-height: 42px; font-size: 15px; padding: 0 14px; }
.failchip { color: #FFD3D5; border-color: #5C2A2E; background: #2A1517; }
.warnchip { color: var(--warn); border-color: #5A4220; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: var(--raised); color: var(--muted); font: 600 12px var(--body); white-space: nowrap; }
.pill.xs { padding: 1px 7px; font-size: 11px; }
.pill.good, .pill.s-done { background: rgba(52, 194, 122, .16); color: var(--good); }
.pill.warn, .pill.s-notdone { background: rgba(240, 168, 72, .14); color: var(--warn); }
.pill.s-today, .pill.s-active { background: rgba(79, 140, 255, .18); color: #9DBEFF; }
.src { font: 600 11.5px var(--body); color: #9DBEFF; background: rgba(79, 140, 255, .10); border-radius: 6px; padding: 1px 6px; text-decoration: none; white-space: nowrap; display: inline-block; margin: 1px 0 1px 2px; }
.srcs { white-space: normal; }
.pnote { font-size: 15px; line-height: 1.45; color: #D5DAE2; }
.pnote.warn { color: #F6D2A0; }
.pnote.bad { color: #FFC2C4; }
.deftag { font-size: 11px; color: var(--muted); border: 1px dashed #5A6474; border-radius: 6px; padding: 0 4px; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
.banner span { flex: 1; }
.banner.warn { background: rgba(240, 168, 72, .12); color: #F6D2A0; }
.banner.bad { background: rgba(255, 91, 97, .12); color: #FFC2C4; }
.syncdot { display: inline-flex; align-items: center; gap: 6px; background: var(--raised); border: 0; border-radius: 999px; padding: 7px 11px; color: var(--muted); font: 600 12px var(--body); }
.syncdot i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.syncdot.good i { background: var(--good); } .syncdot.warn i { background: var(--warn); } .syncdot.bad i { background: var(--bad); }
.foot { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }

/* Today */
.today-card h2 { font-size: 32px; }
.today-card.done { border-color: rgba(52, 194, 122, .35); }
.today-card.rest h2 { color: #CFE0FF; }
.ti-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ti-focus { color: var(--muted); font-size: 14px; margin-top: 3px; }
.target { font-weight: 600; color: #CFE0FF; font-size: 15px; }
.ex-preview { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.ex-preview li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.ex-preview li:last-child { border-bottom: 0; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.dayc { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 0 5px; border-radius: 12px; background: var(--raised); border: 1px solid transparent; color: var(--text); min-height: 80px; min-width: 0; }
.dayc.today { border-color: var(--accent); }
.dayc.done { background: rgba(52, 194, 122, .13); }
.dayc.skipped { opacity: .55; }
.dayc.restd .dc-k { color: var(--muted); }
.dc-wd { font-size: 11px; color: var(--muted); font-weight: 700; }
.dc-n { font: 600 19px/1.1 var(--display); }
.dc-k { font-size: 10.5px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dc-st { height: 15px; color: var(--good); font-weight: 700; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats3 > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stats3 b { font: 600 24px/1.1 var(--display); }
.stats3 span { font-size: 12px; color: var(--muted); }
.of { color: var(--muted); font-size: .72em; }
.racecard { border-color: #4A3A1F; background: linear-gradient(180deg, rgba(240, 168, 72, .07), rgba(240, 168, 72, 0) 70%), var(--surface); }
.racecard.on { border-color: #6A5124; }
.painq { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.importcard { border-color: #2C4A80; }

/* Lists and rows */
.list { display: flex; flex-direction: column; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 12px 4px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--text); text-align: left; width: 100%; min-height: 52px; }
.lrow:last-child { border-bottom: 0; }
.lr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lr-main b { font-weight: 600; font-size: 16px; }
.lr-main small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.lrow.cur b { color: var(--accent); }
.lrow.removed b { text-decoration: line-through; color: var(--muted); }
.lr-main small.modtxt { color: var(--warn); }
.wrow { display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; color: var(--text); width: 100%; }
.wr-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.wr-name { font: 600 21px/1.15 var(--display); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.wr-meta { font-size: 14px; color: var(--muted); }
.wr-ex { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 14.5px; }
.wr-ex li { display: flex; justify-content: space-between; gap: 8px; }
.grp { margin: 8px 2px 0; font: 600 13px var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.empty h3 { color: var(--text); margin-bottom: 6px; }
.searchbox { display: flex; align-items: center; gap: 8px; background: var(--raised); border-radius: 12px; padding: 0 12px; color: var(--muted); }
.searchbox input { flex: 1; background: transparent; border: 0; color: var(--text); font: 500 16px var(--body); min-height: 46px; outline: none; }
.mtable, .pbtable { display: flex; flex-direction: column; }
.mrow { display: grid; grid-template-columns: 1fr 64px 64px; gap: 8px; padding: 10px 2px; border: 0; background: none; border-bottom: 1px solid var(--line); color: var(--text); text-align: left; align-items: center; }
.mrow.head { color: var(--muted); font-size: 12px; text-transform: uppercase; font-weight: 700; }
.mrow > span:not(:first-child) { text-align: right; font-weight: 600; }
.mrow small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
.pbrow { display: flex; justify-content: space-between; gap: 10px; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); text-align: left; width: 100%; }
.pb-v { text-align: right; font-weight: 600; }
.pb-v small { display: block; color: var(--muted); font-weight: 500; }

/* Plan */
.weeknav { display: flex; align-items: center; gap: 0; }
.callist { display: flex; flex-direction: column; }
.calrow { display: flex; align-items: center; gap: 12px; padding: 10px 2px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--text); text-align: left; width: 100%; min-height: 56px; }
.calrow:last-child { border-bottom: 0; }
.calrow.today .cr-d b, .calrow.today .cr-d span { color: var(--accent); }
.cr-d { width: 40px; display: flex; flex-direction: column; align-items: center; flex: none; }
.cr-d b { font-size: 12.5px; }
.cr-d span { font: 600 21px/1.1 var(--display); }
.cr-items { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cr-item { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cr-name { font-weight: 600; }
.cr-tag { font-size: 12px; color: var(--warn); width: 100%; }
.weekrows { display: flex; flex-direction: column; gap: 6px; }
.wkrow { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; background: var(--raised); border: 1px solid transparent; color: var(--text); text-align: left; flex-wrap: wrap; }
.wkrow:disabled { opacity: 1; }
.wkrow.picked { border-color: var(--accent); background: #10203D; }
.wkrow.mod .wr-k { color: var(--warn); }
.wr-d { width: 92px; color: var(--muted); font-size: 14px; }
.wr-k { flex: 1; font-weight: 600; }
.wr-was { font-size: 12px; color: var(--muted); }
.warnbox { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; background: rgba(240, 168, 72, .10); color: #F6D2A0; font-size: 14px; flex-wrap: wrap; }
.warnbox span { flex: 1; min-width: 60%; }
.phasebox { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--raised); border-radius: 12px; align-items: flex-start; }
.phasebox.warn b { color: var(--warn); }
.pweek { display: flex; flex-direction: column; }
.pw-row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); text-align: left; width: 100%; }
.pw-d { width: 36px; color: var(--muted); font-weight: 700; font-size: 14px; flex: none; }
.pw-n { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.pw-n small { color: var(--muted); font-size: 13px; }
.bul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.45; }
.custlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.custlist li { display: flex; align-items: center; gap: 8px; font-size: 14.5px; }
.custlist li > span:nth-child(2) { flex: 1; }
.srclist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.srclist a { color: #9DBEFF; text-decoration: none; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.srclist small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.4; }
.cmptable { display: flex; flex-direction: column; font-size: 13.5px; }
.ct-row { display: grid; grid-template-columns: 78px 1fr 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ct-row.head { font-weight: 700; color: var(--muted); text-transform: uppercase; font-size: 12px; }
.ct-row > span:first-child { font-weight: 700; }
.cmp { display: flex; flex-direction: column; gap: 8px; }
.cmp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmp-o, .cmp-y { background: var(--raised); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cmp-o small, .cmp-y small { color: var(--muted); font-size: 12.5px; }
.cmp-y .pill { align-self: flex-start; margin-top: 2px; white-space: normal; }
.modecard.on { border: 1px solid var(--accent); }

/* Workout */
.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; }
.wk-top { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; border-bottom: 1px solid var(--line); background: rgba(11, 13, 17, .97); }
.wk-title { flex: 1; min-width: 0; }
.wk-name { font: 600 21px/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-clock { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px; display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 640px; margin: 0 auto; }
.wk-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.legend { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.legend .chip { min-height: 20px; font-size: 11px; padding: 0 6px; }
.sess-note { padding: 10px 12px; background: var(--raised); border-radius: 12px; font-size: 14.5px; white-space: pre-wrap; }
.editmeta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.excard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.excard.off { border-style: dashed; background: transparent; }
.excard.ss-head { border-left: 3px solid var(--accent); border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; }
.excard.ss-tail { border-left: 3px solid var(--accent); border-top-left-radius: 6px; border-top-right-radius: 6px; margin-top: -8px; }
.ss-tag { font-size: 12px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ex-h-l { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ex-name { background: none; border: 0; padding: 4px 0; color: var(--accent); font: 600 21px/1.15 var(--display); text-align: left; display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.ex-name .ic { opacity: .7; }
.ex-name-s { font: 600 18px var(--display); }
.ex-sub { font-size: 13px; color: var(--muted); margin-top: -4px; }
.badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 3px 8px; border-radius: 8px; font-weight: 600; }
.badge.swap { background: rgba(240, 168, 72, .12); color: var(--warn); }
.badge.add { background: var(--raised); color: var(--muted); }
.setup-note { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.ex-note { font-size: 14px; color: #D5DAE2; background: var(--raised); padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; }
.hint { display: flex; align-items: center; gap: 8px; padding: 8px 6px 8px 10px; border-radius: 12px; background: rgba(79, 140, 255, .10); border: 1px solid rgba(79, 140, 255, .25); }
.hint.hold { background: rgba(240, 168, 72, .10); border-color: rgba(240, 168, 72, .3); }
.hint-txt { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hint-txt b { font-size: 14.5px; }
.hint-txt small { font-size: 12.5px; color: var(--muted); }
.settable { display: flex; flex-direction: column; gap: 4px; }
.setrow { display: grid; grid-template-columns: 38px minmax(0, 1fr) 72px 58px 46px; gap: 6px; align-items: center; padding: 3px 2px; border-radius: 10px; }
.settable.rir .setrow { grid-template-columns: 34px minmax(0, 1fr) 64px 52px 38px 44px; gap: 5px; }
.settable.nochk .setrow { grid-template-columns: 38px minmax(0, 1fr) 80px 66px; }
.settable.nochk.rir .setrow { grid-template-columns: 34px minmax(0, 1fr) 72px 58px 40px; }
.setrow.head { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding-top: 0; padding-bottom: 0; }
.setrow.head > span { text-align: center; }
.setrow.head > span:nth-child(2) { text-align: left; padding-left: 4px; }
.setrow.head .ctr { display: grid; place-items: center; }
.setrow.done { background: rgba(52, 194, 122, .13); }
.setcap { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 6px 4px 0; }
.setlbl { height: 36px; border-radius: 9px; border: 0; background: var(--raised); color: var(--text); font: 700 15px var(--body); position: relative; padding: 0; }
.setlbl.t-w { color: var(--warn); }
.setlbl.t-d { color: #C9A2FF; }
.setlbl sup { position: absolute; top: 2px; right: 3px; font-size: 9px; color: var(--bad); }
.setlbl.sm { height: 24px; min-width: 26px; display: inline-grid; place-items: center; font-size: 12px; padding: 0 6px; }
.prev { background: none; border: 0; color: var(--muted); font: 500 14px var(--body); text-align: left; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; height: 36px; }
.in { width: 100%; height: 42px; border-radius: 10px; border: 1px solid transparent; background: var(--raised); color: var(--text); font: 600 17px var(--body); text-align: center; font-variant-numeric: tabular-nums; padding: 0 4px; -webkit-appearance: none; appearance: none; }
.in::placeholder { color: #6B7587; font-weight: 500; }
.in:focus { outline: none; border-color: var(--accent); background: #10203D; }
.in.na { display: grid; place-items: center; color: var(--muted); }
.setrow.done .in { background: rgba(52, 194, 122, .10); }
.chk { width: 46px; height: 42px; border-radius: 10px; border: 0; background: var(--raised); color: #5D6676; display: grid; place-items: center; }
.chk.on { background: var(--good); color: #062A16; }
.rirb { height: 36px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 700; padding: 0; }
.rirb.f { color: var(--bad); border-color: #5C2A2E; }
.ex-actions { display: flex; gap: 8px; }
.ex-actions .btn { flex: 1; }
.spacer-xl { height: 240px; flex: none; }
.restbar { position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 8px); z-index: 25; max-width: 624px; margin: 0 auto; background: #121A2B; border: 1px solid #2C4A80; border-radius: 22px; padding: 12px 14px; box-shadow: 0 12px 34px rgba(0, 0, 0, .55); }
.restbar.done { background: var(--good); border-color: var(--good); color: #062A16; animation: pulse 1s ease-in-out 3; }
.restbar.paused { opacity: .85; }
@keyframes pulse { 50% { transform: scale(1.025); } }
.rb-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rb-l { min-width: 0; }
.rb-label { font-size: 13px; font-weight: 700; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rb-time { font: 700 54px/1 var(--display); }
.rb-time small { font-size: 20px; font-weight: 600; }
.rb-prog { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); margin: 10px 0; overflow: hidden; }
.rb-prog i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s linear; }
.restbar.done .rb-prog i { background: #062A16; }
.rb-btns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rb-btns button { height: 46px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, .08); color: inherit; font: 700 16px var(--body); display: grid; place-items: center; }
.restbar.done .rb-btns button { background: rgba(6, 42, 22, .16); }

/* Interval and cardio timers */
.ivs .iv-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; }
.iv-phase { font: 700 30px var(--display); text-transform: uppercase; letter-spacing: .1em; }
.iv-time { font: 700 clamp(96px, 34vw, 190px)/1 var(--display); font-variant-numeric: tabular-nums; }
.iv-round { color: var(--muted); font-size: 17px; text-align: center; }
.iv-prog { width: 100%; max-width: 480px; height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; margin-top: 8px; }
.iv-prog i { display: block; height: 100%; background: currentColor; }
.iv-total { color: var(--muted); font-size: 14px; }
.iv-btns { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); max-width: 640px; margin: 0 auto; width: 100%; }
.iv-foot { text-align: center; font-size: 12.5px; color: var(--muted); padding: 0 20px calc(env(safe-area-inset-bottom) + 10px); }
.ph-work .iv-main { color: #FF8A5B; }
.ph-rest .iv-main { color: #5BD6A0; }
.ph-ready .iv-main { color: #9DBEFF; }
.ph-fin .iv-main { color: var(--good); }
.ph-cardio .iv-main { color: var(--text); }

/* Sheets and dialogs */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .58); }
.sheet-wrap:not(.top) .sheet-bg { background: transparent; }
.sheet { position: relative; width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: var(--surface); border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom) + 18px); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(26px); opacity: .6; } to { transform: none; opacity: 1; } }
.sh-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 16px 10px 10px 18px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sh-titles { min-width: 0; padding-top: 6px; }
.sh-head h2 { font-size: 25px; }
.sh-sub { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
.sh-body { padding: 12px 18px; display: flex; flex-direction: column; gap: 10px; }
.menu.sh-body { gap: 0; }
.mrow2 { display: flex; align-items: center; gap: 14px; padding: 14px 4px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--text); font: 500 16px var(--body); text-align: left; width: 100%; min-height: 54px; }
.mrow2.danger { color: var(--bad); }
.dlg-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; }
.dlg { position: relative; background: var(--raised); border: 1px solid var(--line); border-radius: 20px; padding: 20px; max-width: 400px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
.dlg h3 { font-size: 23px; }
.dlg p { color: #D5DAE2; }
.dlg-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.dlg .btn.ghost { background: #2A303B; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 64px); z-index: 70; background: #F2F4F8; color: #0B0D11; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); max-width: 86vw; text-align: center; }
.crash { padding: 24px; display: flex; flex-direction: column; gap: 12px; }

/* Forms */
.seg { display: flex; background: var(--raised); border-radius: 12px; padding: 3px; gap: 3px; }
.sheet .seg, .card .seg { background: #232833; }
.segb { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: 600 14px var(--body); padding: 0 6px; }
.segb.on { background: var(--bg); color: var(--text); }
.tgl { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; position: relative; cursor: pointer; }
.tgl-l { display: flex; flex-direction: column; gap: 2px; }
.tgl-l small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.tgl input { position: absolute; opacity: 0; width: 52px; height: 32px; right: 0; margin: 0; cursor: pointer; }
.tgl-ui { flex: none; width: 52px; height: 32px; border-radius: 16px; background: #3A414D; position: relative; transition: background .2s; }
.tgl-ui::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; }
.tgl input:checked + .tgl-ui { background: var(--good); }
.tgl input:checked + .tgl-ui::after { transform: translateX(20px); }
.tgl input:focus-visible + .tgl-ui { outline: 2px solid var(--accent); outline-offset: 2px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: #232833; border-radius: 12px; padding: 3px; flex: none; }
.stbtn { width: 44px; height: 40px; border: 0; border-radius: 9px; background: var(--bg); color: var(--text); font: 600 20px var(--body); }
.stval { min-width: 56px; text-align: center; font: 600 17px var(--body); font-variant-numeric: tabular-nums; }
.setrow2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; }
.setrow2.col { flex-direction: column; align-items: stretch; gap: 6px; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.fld input, .fld select, .sel, .ta { font: 500 16px var(--body); color: var(--text); background: #232833; border: 1px solid var(--line); border-radius: 12px; min-height: 46px; padding: 0 12px; width: 100%; -webkit-appearance: none; appearance: none; }
.fld input:focus, .sel:focus, .ta:focus { outline: none; border-color: var(--accent); }
.ta { padding: 10px 12px; min-height: 64px; resize: vertical; }
.ta.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.fld.wide { grid-column: 1 / -1; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.file { color: var(--muted); font-size: 15px; }
.restgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.restgrid .chip { justify-content: center; }
.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.rpeb { height: 42px; border-radius: 9px; border: 0; background: #232833; color: var(--text); font-weight: 700; padding: 0; }
.rpeb.on { background: var(--accent); color: #fff; }
.durf { display: flex; gap: 8px; }
.durf label { flex: 1; display: flex; align-items: center; gap: 6px; }
.durf input { text-align: center; font-size: 18px; font-weight: 600; }
.durf span { color: var(--muted); font-size: 13px; }
.movepick { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
.storagebox { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 12px; background: var(--raised); font-size: 14px; }
.storagebox.synced b { color: var(--good); }
.storagebox.offline b, .storagebox.local b { color: var(--warn); }
.storagebox.error b, .storagebox.memory b { color: var(--bad); }
.storagebox small { color: var(--muted); }
.kvs { display: flex; flex-direction: column; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.kv span { color: var(--muted); flex: none; }
.kv b { text-align: right; font-weight: 600; }
.kv b small { color: var(--muted); font-weight: 500; }
.histline { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.histline > span:first-child { flex: none; color: var(--muted); }
.histline > span:last-child { text-align: right; color: #D5DAE2; }
.btnline { background: none; border-left: 0; border-right: 0; border-top: 0; color: var(--text); width: 100%; text-align: left; }
.dex { padding: 10px 0; border-bottom: 1px solid var(--line); }
.dex-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.dsets { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.dsets li { display: flex; align-items: center; gap: 10px; font-size: 15px; }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 500 10px var(--body); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--accent); }
.chart .dot-last { fill: var(--bg); stroke: var(--accent); stroke-width: 3; }
.chart .val { fill: var(--text); font: 700 12px var(--body); }
.chart .val-sm { fill: var(--muted); font: 600 9.5px var(--body); }
.chart .bar { fill: #34548C; }
.chart .bar-last { fill: var(--accent); }
.chart .bar-ghost { fill: none; stroke: #566173; stroke-dasharray: 3 3; }
.chart-empty { padding: 18px; text-align: center; color: var(--muted); font-size: 14px; background: var(--raised); border-radius: 12px; }
.ch-t { font-weight: 600; font-size: 15px; margin-top: 6px; }
.ch-t small { color: var(--muted); font-weight: 500; margin-left: 4px; font-size: 12.5px; }

@media (max-width: 360px) {
  .setrow { grid-template-columns: 34px minmax(0, 1fr) 64px 52px 42px; gap: 4px; }
  .hdr h1 { font-size: 34px; }
  .dc-k { font-size: 9.5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

let chartSeq = 0;

  if (vals.length < 2) return html`<div class="chart-empty">${vals.length === 1 ? 'One data point so far. The line appears after the next session.' : 'No data yet.'}</div>`;
  const W = 340, L = 40, R = 14, T = 14, B = 24;
  let lo = Math.min(...vals), hi = Math.max(...vals); if (lo === hi) { lo -= Math.max(1, Math.abs(lo) * 0.1); hi += Math.max(1, Math.abs(hi) * 0.1); }
  const pad = (hi - lo) * 0.15; lo = Math.max(Math.min(...vals) >= 0 ? 0 : -Infinity, lo - pad); hi += pad;
  const n = pts.length; const x = i => L + (n === 1 ? 0 : (i * (W - L - R)) / (n - 1)); const y = v => T + ((hi - v) * (h - T - B)) / (hi - lo);

  const d = seg.map((q, k) => (k ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const area = d + ' L' + seg[seg.length - 1][0].toFixed(1) + ' ' + (h - B) + ' L' + seg[0][0].toFixed(1) + ' ' + (h - B) + ' Z';
  const ticks = niceTicks(lo, hi).filter(t => t >= lo && t <= hi);
  const last = seg[seg.length - 1];
  const xl = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i);
  return html`<svg class="chart" viewBox=${'0 0 ' + W + ' ' + h} role="img" aria-label=${'Chart, latest ' + fmt(last[2].y) + unit}>
    <defs><linearGradient id=${id} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.32" /><stop offset="1" stop-color="var(--accent)" stop-opacity="0" /></linearGradient></defs>
    ${ticks.map(t => html`<g><line x1=${L} x2=${W - R} y1=${y(t)} y2=${y(t)} class="grid" /><text x=${L - 6} y=${y(t) + 4} class="axis" text-anchor="end">${fmt(t)}</text></g>`)}
    <path d=${area} fill=${'url(#' + id + ')'} />
    <path d=${d} class="line" />
    ${seg.map(q => html`<circle cx=${q[0]} cy=${q[1]} r="2.4" class="dot" />`)}
    <circle cx=${last[0]} cy=${last[1]} r="5" class="dot-last" />
    <text x=${Math.min(last[0], W - R - 2)} y=${Math.max(T + 8, last[1] - 10)} class="val" text-anchor="end">${fmt(last[2].y)}${unit}</text>
    ${xl.map(i => html`<text x=${x(i)} y=${h - 6} class="axis" text-anchor=${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}>${pts[i].x}</text>`)}
  </svg>`;
}
function BarChart({ pts, fmt = v => fmtInt(v), h = 150, unit = '', ghostKey = null, valKey = 'y' }) {
  const vals = pts.map(p => Math.max(p[valKey] || 0, ghostKey ? p[ghostKey] || 0 : 0));

/* ===== The Protocol ===== */
function customisations(st) {
  const out = [];
  for (const mode of ['2026', '2022']) {
    const prog = progOf(mode); const L = layoutOf(st, mode); const tag = mode === '2026' ? '2026' : '2022';
    WD.forEach((w, i) => { if (L[w] !== prog.layout[w]) out.push({ tag, t: WD_L[i] + ': ' + (dayDef(mode, L[w]) || {}).name + ' (Huberman: ' + (dayDef(mode, prog.layout[w]) || {}).name + ')', reset: () => updateSettings(s => { s.layout[mode] = {}; }) }); });
    for (const day of Object.values(prog.days)) for (const sl of (day.slots || [])) {
      const c = (st.custom[mode] || {})[sl.id]; if (!c || !Object.keys(c).length) continue; const parts = [];
      if (c.ex && c.ex !== sl.ex) parts.push((EX[sl.ex] || {}).name + ' → ' + (EX[c.ex] || {}).name);
      if (c.sets) parts.push('sets ' + setsText(c.sets)); if (c.reps) parts.push('reps ' + repsText(c.reps)); if (c.rest != null) parts.push('rest ' + fmtRest(c.rest)); if (c.warm != null) parts.push(c.warm + ' warm-up' + (c.warm === 1 ? '' : 's')); if (c.removed) parts.push('removed from the session');
      out.push({ tag, t: day.name + ': ' + (parts.join(', ') || 'changed'), reset: () => updateSettings(s => { delete s.custom[mode][sl.id]; }) });
    }
    for (const [dk, arr] of Object.entries(st.added[mode] || {})) for (const sl of arr) out.push({ tag, t: ((prog.days[dk] || {}).name || dk) + ': added ' + (EX[sl.ex] || {}).name, reset: () => updateSettings(s => { s.added[mode][dk] = (s.added[mode][dk] || []).filter(x => x.id !== sl.id); }) });
    const n = Object.keys(st.overrides[mode] || {}).length; if (n) out.push({ tag, t: n + ' one-off calendar change' + (n === 1 ? '' : 's') + ' (moves, skips or replacements)', reset: null });
  }
  if (st.race.on) out.push({ tag: 'App', t: 'Race-week mode is on: leg days and intervals are replaced', reset: null });
  if (st.maxHr) out.push({ tag: 'App', t: 'Custom max heart rate: ' + st.maxHr + ' bpm', reset: () => updateSettings(s => { s.maxHr = null; }) });
  return out;
}

/* ---- Calendar day ---- */
function MovePicker({ d, onPick }) {
  const t = todayISO(); const opts = []; for (let k = -3; k <= 7; k++) { const x = addDays(d, k); if (k !== 0) opts.push(x); }
  return html`<div class="movepick"><div class="muted xs">Move to:</div><div class="chips">${opts.map(x => html`<button class=${'chip btnchip' + (x === t ? ' on' : '')} onClick=${() => onPick(x)}>${fmtDay(x)}${x === t ? ' (today)' : ''}</button>`)}</div></div>`;
}
function ReplacePicker({ mode, cur, onPick }) {
  const keys = sessionKeys(mode).filter(k => k !== cur);
  return html`<div class="movepick"><div class="muted xs">Choose a session:</div><div class="chips">${keys.map(k => html`<button class="chip btnchip" onClick=${() => onPick(k)}>${dayDef(mode, k).name}</button>`)}</div></div>`;
}
function startFor(it, d) {
  const mode = S.settings.mode; const k = it.def.kind; const t = todayISO();
  if (d < t) {

    replaceSheet(k === 'interval' ? 'ivlog' : 'cardiolog', { mode, key: it.key, d }); return;
  }

  else if (k === 'interval') replaceSheet('ivsetup', { mode, key: it.key, d });
  else if (k === 'cardio') replaceSheet('cardiolog', { mode, key: it.key, d });
}
function openEditorFor(mode, key, d) {

  w.timeUnknown = true; w.isNew = true; w.durationSec = null; w.race = false; w.date = d; w.plannedDate = d;
  closeAllSheets(); S.ui.editWorkout = w; emit();
}
function DaySheet({ d }) {

  return html`<${SheetHead} title=${fmtDay(d, { long: true })} sub=${d === t ? 'Today' : d < t ? 'Past' : 'Coming up'} /><div class="sh-body">
    ${!items.length && html`<p class="muted">Nothing planned for this day.</p>`}
    ${items.map(it => { const x = itemStatus(it, d, wsOn); const sess = SESSION_KINDS.includes(it.def.kind); const tags = itemTags(it); return html`<div class="card flat">
      <div class="row-between"><div><div class="eyebrow">${KIND_TXT[it.def.kind]}${tags.length ? ' · ' + tags.join(' · ') : ''}</div><h3>${it.def.name}</h3><div class="muted small">${it.def.focus}</div></div><span class=${'pill s-' + x.s}>${STATUS_TXT[x.s]}</span></div>

        ${sess && d <= t && x.s !== 'skipped' && html`<button class="btn primary" onClick=${() => startFor(it, d)}>${d < t ? 'Log it' : 'Start'}</button>`}
        ${sess && d < t && x.s !== 'skipped' && html`<button class="btn ghost" onClick=${() => { moveItem(mode, d, it.idx, t); toast('Moved to today'); }}>Do it today</button>`}
        <button class="btn ghost" onClick=${() => { setMoving(moving === it.idx ? null : it.idx); setReplacing(null); }}>Move</button>
